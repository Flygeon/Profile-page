name: Deploy on Astro Update
on:
  repository_dispatch:
    types: [astro-updated]  # 监听来自 Astro 仓库的信号

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 pnpm 包管理器
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      # 安装 Node.js 并配置 pnpm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # 安装项目依赖
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 构建项目：生成图标 → Astro 构建 → Pagefind 索引
      - name: Build
        run: pnpm run build

      # 推送 dist 目录到 build 分支
      - name: Push to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: build

      # 使用 wrangler CLI 部署到 Cloudflare Workers
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          # Cloudflare API Token，需要 Edit Cloudflare Workers 权限
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Cloudflare 账户 ID，在 Dashboard 右侧栏可见
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
