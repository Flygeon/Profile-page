name: Deploy on Astro Update
on:
  repository_dispatch:
    types: [astro-updated]  # 监听来自 Astro 仓库的信号

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 pnpm 包管理器
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      # 安装 Node.js 并配置 pnpm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # 安装项目依赖
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 构建项目：生成图标 → Astro 构建 → Pagefind 索引
      - name: Build
        run: pnpm run build

      # 【新增】调试构建产物
      - name: Debug build output
        run: |
          echo "当前目录内容："
          ls -la
          echo "检查 dist 目录："
          if [ -d "./dist" ]; then
            echo "✅ dist 目录存在，内容如下："
            ls -la ./dist
          else
            echo "❌ 错误：dist 目录不存在！"
            echo "尝试查找可能的输出目录："
            find . -maxdepth 2 -type d -name "build" -o -name "public" -o -name "out" 2>/dev/null
            exit 1
          fi

      # 【修改】推送 dist 目录到 build 分支
      - name: Push to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: build
          force_orphan: true  # 强制创建独立分支，避免历史冲突
          commit_message: "Deploy from Astro update ${{ github.sha }}"

      # 【修改】部署到 Cloudflare Workers（添加错误处理）
      - name: Deploy to Cloudflare Workers
        run: |
          if [ -f "./wrangler.toml" ]; then
            echo "🚀 开始部署到 Cloudflare Workers..."
            npx wrangler deploy
            echo "✅ Cloudflare Workers 部署完成"
          else
            echo "⚠️ 未找到 wrangler.toml 文件，跳过 Workers 部署"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
