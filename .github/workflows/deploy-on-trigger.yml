name: Deploy on Astro Update
on:
  repository_dispatch:
    types: [astro-updated]

# ========== 关键修改：授予写入权限 ==========
permissions:
  contents: write  # 允许推送到代码仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ========== 新增：等待 60 秒，确保博客构建完成 ==========
      - name: Wait for blog build to complete
        run: |
          echo "⏳ 检测到 Astro 更新，等待 60 秒确保博客构建完成..."
          sleep 60
          echo "✅ 等待完成，开始构建个人站"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Debug build output
        run: |
          echo "当前目录内容："
          ls -la
          echo "检查 out 目录："
          if [ -d "./out" ]; then
            echo "✅ out 目录存在，内容如下："
            ls -la ./out
          else
            echo "❌ 错误：out 目录不存在！"
            echo "尝试查找可能的输出目录："
            find . -maxdepth 2 -type d -name "build" -o -name "public" -o -name "dist" 2>/dev/null
            exit 1
          fi

      - name: Push to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: build
          force_orphan: true
          commit_message: "Deploy from Astro update ${{ github.sha }}"

      - name: Deploy to Cloudflare Pages
        run: |
          if [ -d "./out" ]; then
            echo "🚀 开始部署到 Cloudflare Pages..."
            npx wrangler pages deploy ./out --project-name=profiles
            echo "✅ Cloudflare Pages 部署完成"
          else
            echo "❌ out 目录不存在，跳过 Pages 部署"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
